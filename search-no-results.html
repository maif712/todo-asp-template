<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="css/search.css">
    <title>Search Results</title>
</head>

<body>

    <header class="header">
        <div class="layout-wrapper flex justify-between gap-4">
            <a href="index.html" class="header__logo">Todo App</a>
            <div class="search-container">
                <form class="search-form" action="search.html" method="GET">
                    <input type="text" name="q" class="search-input" placeholder="Search anything..." autocomplete="off">
                    <button type="submit" class="search-button">
                        <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <span class="search-text">Search</span>
                    </button>
                </form>
            </div>
            <nav class="primay-nav" aria-expanded="false">
                <button class="close-mobile-menu">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                    </svg>
                </button>
                <ul class="header__ul">
                    <li class="header__li"><a href="index.html" class="header__a">Home</a></li>
                    <li class="header__li"><a href="todo-management.html" class="header__a">Todo Management</a></li>
                    <li class="header__li"><a href="#" class="header__a">About Us</a></li>
                </ul>
            </nav>
            <button class="ham-mobile-menu">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="size-6">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                </svg>
            </button>
        </div>
    </header>

    <main class="main">
        <div class="layout-wrapper">
            <div class="no-results-container">
                <div class="no-results__illustration">
                    <svg class="no-results__svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        <line x1="11" y1="8" x2="11" y2="11"></line>
                        <line x1="11" y1="14" x2="11.01" y2="14"></line>
                    </svg>
                </div>
                <h2 class="no-results__title">No results found</h2>
                <p class="no-results__message">We couldn't find any results for "<b>unusual search term</b>". Try searching for something else.</p>
            </div>
        </div>
    </main>

    <script src="./app.js"></script>
</body>

</html>
